<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tab-list {
            display: flex;
            border-radius: 12px 12px 0 0;
            background-color: #e2e8f8;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .tab-item {
            flex: 1;
            height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            opacity: 0.65;
            color: red;
            font-weight: 600;
            position: relative;
        }

        .tab-icon {
            width: 17px;
            height: 17px;
            margin-right: 4px;
        }

        .tab-selected {
            opacity: 1;
            background: #ffffff;

            border-radius: 12px 12px 0 0;

            box-shadow: 12px 12px 0 0 blue, -12px 12px 0 0 blue;

            box-shadow: 12px 12px 0 0 #ffffff, -12px 12px 0 0 #ffffff;
        }

        .tab-selected::before {
            content: '';
            position: absolute;
            left: -12px;
            bottom: 0;
            width: 12px;
            height: 52px;
            background: red;
            border-radius: 0 0 12px 0;

            background: #e2e8f8;

        }

        .tab-selected::after {
            content: '';
            position: absolute;
            right: -12px;
            bottom: 0;
            width: 12px;
            height: 52px;
            background: red;
            border-radius: 0 0 0 12px;

            background: #e2e8f8;
        }
    </style>
</head>

<body>
    <div class="tab-list">
        <div class="tab-item">tab页1</div>
        <div class="tab-item ">tab页2</div>
        <div class="tab-item tab-selected">tab页3</div>
    </div>
    <script>
        // 纯 JS 切换，只修改类名，不加 transition
        const tabs = document.querySelectorAll('.tab-item');
        const panels = document.querySelectorAll('.content-panel');

        function switchTab(selectedTab) {
            // 获取对应的内容面板 id
            const tabId = selectedTab.getAttribute('data-tab');

            // 切换标签的类：移除所有 tab-selected，添加 not-selected；再将当前标签加上 tab-selected，移除 not-selected
            tabs.forEach(tab => {
                tab.classList.remove('tab-selected');
                tab.classList.add('not-selected');
            });
            selectedTab.classList.remove('not-selected');
            selectedTab.classList.add('tab-selected');

            // 切换内容面板
            panels.forEach(panel => {
                panel.style.display = 'none';
            });
            const activePanel = document.getElementById(`tab${tabId}`);
            if (activePanel) activePanel.style.display = 'block';
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', function () {
                switchTab(this);
            });
        });
    </script>
</body>

</html>
